<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar speed log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8ecef; --panel:#f6f8f9; --ink:#14212b; --mute:#5d6b76; --line:#cdd5db;
  --accent:#1f5fa8; --accent-ink:#ffffff; --good:#2e8b3d; --warn:#d99a10; --bad:#c9382f;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0f151a; --panel:#18212a; --ink:#e6edf2; --mute:#8fa0ad; --line:#2a3742;
         --accent:#6aa7ee; --accent-ink:#0b1a2b; --good:#58b868; --warn:#e9b43a; --bad:#ee6a60; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);padding:16px;max-width:760px;margin-inline:auto}
h1{font:600 28px/1.1 var(--num);margin:0;letter-spacing:.01em}
button{font:500 15px/1 var(--body);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:12px 16px;border-radius:6px;cursor:pointer;min-height:44px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--bad)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.sub{margin:4px 0 0;color:var(--mute);font-size:14px}
.sub.good{color:var(--good)} .sub.warn{color:var(--warn)} .sub.bad{color:var(--bad)}
.notice{background:var(--panel);border:1px solid var(--warn);border-radius:6px;padding:12px 14px;margin-bottom:16px;font-size:15px}
.live{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 18px 14px;margin-bottom:20px}
.big{display:flex;align-items:baseline;gap:10px}
.num{font:600 96px/0.95 var(--num);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.unit{color:var(--mute);font-size:16px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 16px}
.stats dt{color:var(--mute);font-size:13px}
.stats dd{margin:0;font:600 28px/1.1 var(--num);font-variant-numeric:tabular-nums}
.controls{display:flex;gap:10px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;min-width:84px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.hint{margin:10px 0 0;color:var(--mute);font-size:13px}
.set{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.set h2{font:600 22px/1.1 var(--num);margin:0}
.set .when{color:var(--mute);font-size:13px;margin:2px 0 0}
.set .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.kg{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:14px}
.kg input{width:84px;font:500 16px var(--body);padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.summary{display:flex;gap:20px;flex-wrap:wrap;margin:10px 0 4px}
.summary div{font-size:13px;color:var(--mute)}
.summary b{display:block;font:600 22px/1.1 var(--num);color:var(--ink)}
.chart{width:100%;height:auto;max-height:150px;display:block;margin:6px 0}
.chart text{fill:var(--mute);font:500 10px var(--body)}
details{margin-top:6px}
summary{cursor:pointer;color:var(--accent);font-size:14px;padding:6px 0}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:500}
.del{margin-top:8px;min-height:36px;padding:8px 12px;font-size:13px}
.empty{color:var(--mute);padding:24px 8px;text-align:center}
footer{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
@media (max-width:480px){ .num{font-size:80px} .stats{grid-template-columns:repeat(3,1fr)} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>Bar speed log</h1>
    <p class="sub bad" id="devline">Not connected</p>
  </div>
  <button class="primary" id="btnConn">Connect tracker</button>
</header>

<div class="notice" id="unsupported" hidden>
  This browser can't use Web Bluetooth. Use Chrome on Android or desktop, or the Bluefy browser on iPhone.
</div>

<section class="live" aria-label="Latest rep">
  <div class="big"><span class="num" id="lvMcv">0.00</span><span class="unit">m/s mean velocity</span></div>
  <dl class="stats">
    <div><dt>Peak (m/s)</dt><dd id="lvPeak">–</dd></div>
    <div><dt>Range (cm)</dt><dd id="lvRom">–</dd></div>
    <div><dt>Velocity loss</dt><dd id="lvLoss">–</dd></div>
    <div><dt>Pause</dt><dd id="lvPause">–</dd></div>
    <div><dt>Rep in set</dt><dd id="lvRep">–</dd></div>
  </dl>
  <div class="controls">
    <div class="seg" id="liftSeg" role="group" aria-label="Lift">
      <button data-lift="0" disabled>Squat</button>
      <button data-lift="1" disabled>Comp bench</button>
      <button data-lift="2" disabled>T&amp;G bench</button>
    </div>
    <button id="btnNew" disabled>Start new set</button>
  </div>
  <p class="hint">Lift and set changes reach the tracker while the bar is still.</p>
</section>

<section id="sets" aria-label="Logged sets"></section>

<footer>
  <button id="btnCsv">Export CSV</button>
  <button id="btnClear" class="danger">Clear log</button>
</footer>

<script>
const SVC='b5a10000-6d3e-4f1c-9a52-3c7e2d8f4a10';
const REP='b5a10001-6d3e-4f1c-9a52-3c7e2d8f4a10';
const STA='b5a10002-6d3e-4f1c-9a52-3c7e2d8f4a10';
const CTL='b5a10003-6d3e-4f1c-9a52-3c7e2d8f4a10';
const LIFTS=['Squat','Comp bench','T&G bench'];
const LS_KEY='barspeed.v1';
const LOSS_WARN=20, LOSS_STOP=30;

const $=id=>document.getElementById(id);
let state={reps:[],meta:{},deleted:[]};
try{ const s=JSON.parse(localStorage.getItem(LS_KEY)||'null'); if(s&&Array.isArray(s.reps)) state={reps:s.reps,meta:s.meta||{},deleted:s.deleted||[]}; }catch(e){}
const OLD_LIFTS=['Squat','Bench','Deadlift'];
state.reps.forEach(r=>{ if(!r.liftName) r.liftName=OLD_LIFTS[r.lift]||('Lift '+r.lift); });
const seen=new Set(state.reps.map(r=>r.key));

let device=null, server=null, chars={}, status=null, offset=null;
let userDisconnect=false, retry=0, connText='Not connected', connCls='bad';
let saveT=0, renderPending=false, wakeLock=null;

function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{ try{ localStorage.setItem(LS_KEY,JSON.stringify(state)); }catch(e){} },300);
}

/* ---------- connection ---------- */
function setConn(text,cls){ connText=text; connCls=cls; renderHead(); }
function isConnected(){ return !!(device&&device.gatt&&device.gatt.connected); }

async function pickDevice(){
  if(!navigator.bluetooth){ $('unsupported').hidden=false; return; }
  try{
    device=await navigator.bluetooth.requestDevice({filters:[{services:[SVC]}]});
    device.addEventListener('gattserverdisconnected',onDisconnected);
    userDisconnect=false; retry=0;
    await connectGatt();
  }catch(e){
    if(e.name!=='NotFoundError') setConn('Connection failed: '+e.message,'bad');
  }
}

async function connectGatt(){
  setConn('Connecting...','warn');
  server=await device.gatt.connect();
  const svc=await server.getPrimaryService(SVC);
  chars.rep=await svc.getCharacteristic(REP);
  chars.sta=await svc.getCharacteristic(STA);
  chars.ctl=await svc.getCharacteristic(CTL);
  chars.sta.addEventListener('characteristicvaluechanged',e=>onStatus(e.target.value));
  chars.rep.addEventListener('characteristicvaluechanged',e=>onRep(e.target.value));
  await chars.sta.startNotifications();
  onStatus(await chars.sta.readValue());
  await chars.rep.startNotifications();   // the tracker now replays its stored reps
  retry=0;
  setConn('Connected','good');
  keepAwake();
}

function onDisconnected(){
  chars={}; status=null;
  setConn('Disconnected','bad');
  if(!userDisconnect) scheduleRetry();
}

function scheduleRetry(){
  if(retry>=20){ setConn('Tracker not found. Wake it with BTN2, then press Connect.','bad'); return; }
  retry++;
  setTimeout(async()=>{
    if(userDisconnect||isConnected()||!device) return;
    try{ await connectGatt(); }catch(e){ scheduleRetry(); }
  },2000);
}

async function keepAwake(){
  try{ if('wakeLock' in navigator && !wakeLock) { wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null;}); } }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&isConnected()) keepAwake(); });

async function sendCmd(arr){
  if(!chars.ctl) return;
  try{
    const v=new Uint8Array(arr);
    if(chars.ctl.writeValueWithResponse) await chars.ctl.writeValueWithResponse(v); else await chars.ctl.writeValue(v);
  }catch(e){ setConn('Command failed: '+e.message,'bad'); }
}

/* ---------- incoming data ---------- */
function onStatus(dv){
  if(dv.byteLength<8) return;
  status={lift:dv.getUint8(0), setNo:dv.getUint8(1), batt:dv.getUint8(2), nowMs:dv.getUint32(4,true)};
  offset=Date.now()-status.nowMs;
  renderHead();
}

function onRep(dv){
  if(dv.byteLength<20) return;
  const tMs=dv.getUint32(0,true);
  if(offset===null) offset=Date.now()-tMs;
  const r={
    t:offset+tMs, id:dv.getUint16(4,true), session:dv.getUint8(6), setNo:dv.getUint8(7),
    repInSet:dv.getUint8(8), lift:dv.getUint8(9),
    mcv:dv.getUint16(10,true)/1000, peak:dv.getUint16(12,true)/1000, rom:dv.getUint16(14,true)/1000,
    dur:dv.getUint16(16,true), loss:dv.getUint8(18), pause:(dv.getUint8(19)===255?null:dv.getUint8(19)/10)
  };
  r.liftName=LIFTS[r.lift]||('Lift '+r.lift);
  r.setKey=r.session+'-'+r.setNo;
  r.key=r.session+'-'+r.id;
  if(seen.has(r.key)||state.deleted.includes(r.setKey)) return;
  seen.add(r.key);
  state.reps.push(r);
  save();
  scheduleRender();
}

/* ---------- rendering ---------- */
function lossColor(l){ return l>=LOSS_STOP?'var(--bad)':l>=LOSS_WARN?'var(--warn)':'var(--good)'; }
const fmtTime=t=>new Date(t).toLocaleString([], {dateStyle:'medium', timeStyle:'short'});

function renderHead(){
  let t=connText;
  if(status&&connCls==='good') t+=', battery '+status.batt+'%, '+(LIFTS[status.lift]||'?')+', set '+status.setNo;
  const d=$('devline'); d.textContent=t; d.className='sub '+connCls;
  $('btnConn').textContent=isConnected()?'Disconnect':'Connect tracker';
  const on=!!chars.ctl&&isConnected();
  $('btnNew').disabled=!on;
  document.querySelectorAll('#liftSeg button').forEach(b=>{
    b.disabled=!on;
    b.classList.toggle('on',!!status&&String(status.lift)===b.dataset.lift);
  });
}

function scheduleRender(){
  if(document.activeElement&&document.activeElement.matches&&document.activeElement.matches('input[data-kg]')){ renderPending=true; return; }
  renderPending=false;
  renderLive(); renderSets();
}
document.addEventListener('focusout',()=>{ if(renderPending) setTimeout(scheduleRender,0); });

function renderLive(){
  let last=null;
  for(const r of state.reps) if(!last||r.t>last.t) last=r;
  if(!last){
    $('lvMcv').textContent='0.00'; $('lvMcv').style.color='var(--mute)';
    ['lvPeak','lvRom','lvLoss','lvPause','lvRep'].forEach(i=>$(i).textContent='–');
    return;
  }
  $('lvMcv').textContent=last.mcv.toFixed(2);
  $('lvMcv').style.color=lossColor(last.loss);
  $('lvPeak').textContent=last.peak.toFixed(2);
  $('lvRom').textContent=Math.round(last.rom*100);
  $('lvLoss').textContent=last.loss+'%';
  $('lvPause').textContent=(last.pause==null)?'–':last.pause.toFixed(1)+' s';
  $('lvPause').style.color=(last.pause==null)?'':(last.pause>=1?'var(--good)':'var(--warn)');
  $('lvRep').textContent=last.repInSet;
}

function groupSets(){
  const m=new Map();
  for(const r of state.reps){ if(!m.has(r.setKey)) m.set(r.setKey,[]); m.get(r.setKey).push(r); }
  const out=[];
  for(const [key,reps] of m){ reps.sort((a,b)=>a.id-b.id); out.push({key,reps,t:reps[reps.length-1].t}); }
  out.sort((a,b)=>b.t-a.t);
  return out;
}

function chart(reps){
  const W=360,H=100,pad=6,n=reps.length;
  const max=Math.max(0.1,...reps.map(r=>r.mcv));
  const slot=(W-2*pad)/n, bw=Math.max(4,Math.min(36,slot-4));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mean velocity per rep">`;
  reps.forEach((r,i)=>{
    const h=Math.max(2,(r.mcv/max)*(H-32));
    const x=pad+i*slot+(slot-bw)/2, y=H-16-h;
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${lossColor(r.loss)}"/>`;
    if(n<=12) s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="middle">${r.mcv.toFixed(2)}</text>`;
    if(n<=24) s+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-4}" text-anchor="middle">${r.repInSet}</text>`;
  });
  return s+'</svg>';
}

function renderSets(){
  const sets=groupSets();
  const el=$('sets');
  if(!sets.length){
    el.innerHTML='<p class="empty">No sets logged yet. Connect the tracker and lift. Reps appear here as you go, and the tracker replays any it stored while the phone was away.</p>';
    return;
  }
  el.innerHTML=sets.map(S=>{
    const rs=S.reps, first=rs[0], last=rs[rs.length-1];
    const best=Math.max(...rs.map(r=>r.mcv));
    const avg=rs.reduce((a,r)=>a+r.mcv,0)/rs.length;
    const vl=best>0?(best-last.mcv)/best*100:0;
    const kg=(state.meta[S.key]&&state.meta[S.key].kg)||'';
    const rows=rs.map(r=>`<tr><td>${r.repInSet}</td><td>${r.mcv.toFixed(2)}</td><td>${r.peak.toFixed(2)}</td><td>${Math.round(r.rom*100)}</td><td>${(r.dur/1000).toFixed(2)}</td><td>${r.pause==null?'–':r.pause.toFixed(1)}</td><td>${r.loss}%</td></tr>`).join('');
    return `<article class="set">
      <div class="row">
        <div><h2>${first.liftName||'Lift'}, ${rs.length} ${rs.length===1?'rep':'reps'}</h2><p class="when">${fmtTime(first.t)}</p></div>
        <label class="kg">Load <input type="number" inputmode="decimal" step="0.5" min="0" placeholder="kg" value="${kg}" data-kg="${S.key}"> kg</label>
      </div>
      <div class="summary">
        <div><b>${avg.toFixed(2)}</b>average m/s</div>
        <div><b>${best.toFixed(2)}</b>best m/s</div>
        <div><b>${vl.toFixed(0)}%</b>velocity loss</div>
      </div>
      ${chart(rs)}
      <details><summary>Rep details</summary>
        <table><thead><tr><th>Rep</th><th>Mean</th><th>Peak</th><th>Range cm</th><th>Time s</th><th>Pause s</th><th>Loss</th></tr></thead><tbody>${rows}</tbody></table>
        <button class="del danger" data-del="${S.key}">Delete this set</button>
      </details>
    </article>`;
  }).join('');
}

/* ---------- actions ---------- */
$('btnConn').addEventListener('click',()=>{
  if(isConnected()){ userDisconnect=true; device.gatt.disconnect(); }
  else if(device&&!userDisconnect){ retry=0; connectGatt().catch(()=>pickDevice()); }
  else pickDevice();
});
$('btnNew').addEventListener('click',()=>sendCmd([1]));
$('liftSeg').addEventListener('click',e=>{ const b=e.target.closest('button[data-lift]'); if(b&&!b.disabled) sendCmd([2,+b.dataset.lift]); });

$('sets').addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.kg;
  if(!k) return;
  const v=parseFloat(e.target.value);
  state.meta[k]=state.meta[k]||{};
  state.meta[k].kg=isNaN(v)?'':v;
  save();
});
$('sets').addEventListener('click',e=>{
  const k=e.target.dataset&&e.target.dataset.del;
  if(!k) return;
  if(!confirm('Delete this set from the log?')) return;
  state.reps=state.reps.filter(r=>r.setKey!==k);
  delete state.meta[k];
  state.deleted.push(k);
  save(); scheduleRender();
});

$('btnClear').addEventListener('click',()=>{
  if(!state.reps.length) return;
  if(!confirm('Delete every logged set from this browser?')) return;
  for(const r of state.reps) if(!state.deleted.includes(r.setKey)) state.deleted.push(r.setKey);
  state.reps=[]; state.meta={};
  save(); scheduleRender();
});

$('btnCsv').addEventListener('click',()=>{
  if(!state.reps.length) return;
  const head='time,session,set,rep,lift,load_kg,mean_velocity_ms,peak_velocity_ms,range_m,duration_ms,pause_s,velocity_loss_pct';
  const rows=[...state.reps].sort((a,b)=>a.t-b.t).map(r=>{
    const kg=(state.meta[r.setKey]&&state.meta[r.setKey].kg)||'';
    return [new Date(r.t).toISOString(),r.session,r.setNo,r.repInSet,r.liftName||r.lift,kg,r.mcv.toFixed(3),r.peak.toFixed(3),r.rom.toFixed(3),r.dur,(r.pause==null?'':r.pause.toFixed(1)),r.loss].join(',');
  });
  const blob=new Blob([head+'\n'+rows.join('\n')+'\n'],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='bar-speed-log-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
});

/* ---------- start ---------- */
if(!navigator.bluetooth) $('unsupported').hidden=false;
renderHead(); scheduleRender();
</script>
</body>
</html>
